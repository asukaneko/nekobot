name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-check:
    name: Code Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install check tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest

      - name: Ruff critical check
        run: |
          ruff check . --select E9,F63,F7,F82

      - name: Python syntax compile check
        run: |
          python -m compileall -q bot.py nbot tools tests

      - name: JavaScript checks and regression tests
        run: |
          node --check nbot/web/static/js/nbot-methods.js
          node --check nbot/web/static/js/i18n.js
          node --check nbot/web/static/sw.js
          node tests/js/context_stats_harness.js
          node tests/js/dashboard_charts_harness.js
          node tests/js/plugin_bridge_harness.js

      - name: Install project dependencies if tests exist
        if: ${{ hashFiles('tests/**') != '' }}
        run: |
          python -m pip install -r requirements.txt

      - name: Run Python regression tests
        run: |
          python -m pytest -q
